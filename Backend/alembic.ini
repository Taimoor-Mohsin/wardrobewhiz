[alembic]
# Path to migration scripts, relative to this file
script_location = alembic

# Prepend Backend/ to sys.path so env.py can do:
#   from app.core.config import settings
#   config.set_main_option("sqlalchemy.url", settings.database_url)
prepend_sys_path = .

# Separator used when downgrading across multiple heads
version_path_separator = os

# Default URL — overridden at runtime by env.py reading from .env via
# pydantic-settings (app/core/config.py → settings.database_url).
# Keep this in sync with the default in config.py so plain `alembic`
# commands still work without a .env file present.
sqlalchemy.url = sqlite:///./wardrobewhiz.db

# Filename pattern for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in migration filenames
# timezone =

# Maximum length of the slug portion of migration filenames
truncate_slug_length = 40


# --- Logging configuration ---------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
